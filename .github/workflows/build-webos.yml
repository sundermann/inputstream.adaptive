name: Build webOS
on: [push, pull_request]
env:
  app_id: inputstream.adaptive

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "Ubuntu x64 package test"
          os: ubuntu-latest
          ZIP_NAME_SUFFIX: webos
    steps:
    - name: Install cmake
      run: |
        sudo apt update
        sudo apt install cmake
    - name: Download SDK release
      uses: robinraju/release-downloader@v1.11
      with:
        repository: "openlgtv/buildroot-nc4"
        latest: true
        fileName: "linux-intel-webos-sdk.tar.gz"
        out-file-path: sdk
    - name: Extract webOS NDK
      working-directory: sdk
      run: |
        tar xzf linux-intel-webos-sdk.tar.gz
        ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh
    - name: Checkout Kodi repo
      uses: actions/checkout@v4
      with:
        repository: xbmc/xbmc
        ref: master
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v4
      with:
        path: ${{ env.app_id }}
    - name: Configure
      run: |
        cd ${app_id} && mkdir -p build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdk/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake" -DADDONS_TO_BUILD=${app_id} -DADDON_SRC_PREFIX="${{ github.workspace }}" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/xbmc/addons" -DPACKAGE_ZIP=1 -DPACKAGE_DIR="${{ github.workspace }}/build_zips" -DCORE_SOURCE_DIR=${{ github.workspace }}/xbmc -DCMAKE_PREFIX_DIR=${{ github.workspace }}/inputstream.adaptive/inputstream.adaptive/build/build/depends "${{ github.workspace }}/xbmc/cmake/addons"
    - name: Build
      run: |
        cd ${app_id}/build
        make
    - name: Run tests
      run: |
        cd ${app_id}/build/${app_id}-prefix/src/${app_id}-build
        make CTEST_OUTPUT_ON_FAILURE=1 GTEST_COLOR=1 test
    - name: Make ZIP artifact
      run: |
        cd ${{ github.workspace }}/xbmc/addons
        zip -r inputstream.adaptive.zip inputstream.adaptive
    - name: Upload zipped artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.app_id }}_${{ matrix.ZIP_NAME_SUFFIX }}.zip
        path: ${{ github.workspace }}/xbmc/addons/inputstream.adaptive.zip
